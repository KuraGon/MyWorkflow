databaseChangeLog:
  - changeSet:
      id: 20231027-002-add-legacy-user-fields
      author: BBO
      changes:
        - dropColumn:
            tableName: users
            columns:
              - column:
                  name: erp_id
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: username
                  type: varchar(255)
              - column:
                  name: active
                  type: boolean
              - column:
                  name: legacy_id
                  type: bigint
                  constraints:
                    unique: true
              - column:
                  name: legacy_group_id
                  type: bigint