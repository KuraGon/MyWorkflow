<div class="min-h-screen w-full bg-white flex">
  <!-- Left panel -->
  <aside *ngIf="showLeftPanel" class="hidden lg:flex lg:w-1/3 relative overflow-hidden">
    <div class="left-bg absolute inset-0"></div>

    <!-- soft blobs -->
    <div class="blob blob--1"></div>
    <div class="blob blob--2"></div>

    <div class="relative z-10 flex flex-col justify-between w-full p-10 text-white">
      <div class="flex items-center gap-3">
        <img
          src="assets/logo.png"
          alt="SAAMP"
          class="h-10 md:h-12 w-auto mx-1 transition-all duration-300"
        />
      </div>

      <div class="text-white/70 text-sm">
        Copyright © {{ year }} Saamp
      </div>
    </div>
  </aside>

  <!-- Right panel -->
  <main class="flex-1 flex items-center justify-center px-6 py-12">
    <mat-card class="w-full max-w-md !rounded-2xl !shadow-xl bg-[#f7f7f7]">
      <div class="p-8 sm:p-10">
        <div class="text-center mb-8">
          <h1 class="text-2xl font-semibold text-slate-900">{{ title }}</h1>
          <p class="text-slate-500 mt-2">{{ subtitle }}</p>
        </div>

        <!-- zone injectée -->
        <ng-content></ng-content>
      </div>
    </mat-card>
  </main>
</div>
